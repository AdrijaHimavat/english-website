<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Nastaliq+Urdu:wght@600&family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@500;700&family=Cinzel:wght@600&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
/* Layout: brass masthead, sticky tab bar; each view has a narrow form column beside the result; one column on phones. */
:root {
  --paper: #edf0f6;
  --surface: #f8f9fc;
  --sunk: #e2e6f0;
  --ink: #18203f;
  --muted: #586083;
  --line: #c9cfde;
  --lapis: #25367c;
  --lapis-soft: #d9def2;
  --brass: #946c22;
  --brass-soft: #efe3c8;
  --turq: #0f7772;
  --good: #1c7449;
  --good-bg: #dcefe3;
  --hard: #a3352c;
  --hard-bg: #f6dfdc;
  --mixed: #7d5f12;
  --mixed-bg: #f2e8cf;
  --font-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "Noto Serif", Georgia, serif;
  --font-brand: "Cinzel", "Noto Serif", Georgia, serif;
  --font-glyph: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1124; --surface: #131b35; --sunk: #0f1630; --ink: #ebe6d6; --muted: #9ba2bf; --line: #2a3458;
    --lapis: #93a7f2; --lapis-soft: #1d2a55; --brass: #d8ad58; --brass-soft: #2e2716; --turq: #49c4b9;
    --good: #67c995; --good-bg: #133326; --hard: #ee8276; --hard-bg: #3a1a19; --mixed: #dcb460; --mixed-bg: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1124; --surface: #131b35; --sunk: #0f1630; --ink: #ebe6d6; --muted: #9ba2bf; --line: #2a3458;
  --lapis: #93a7f2; --lapis-soft: #1d2a55; --brass: #d8ad58; --brass-soft: #2e2716; --turq: #49c4b9;
  --good: #67c995; --good-bg: #133326; --hard: #ee8276; --hard-bg: #3a1a19; --mixed: #dcb460; --mixed-bg: #33290f;
  color-scheme: dark;
}
:root:lang(fa) { --font-body: "Vazirmatn", Tahoma, sans-serif; --font-head: "Noto Naskh Arabic", "Vazirmatn", serif; --font-brand: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; }
:root:lang(ar) { --font-body: "Vazirmatn", Tahoma, sans-serif; --font-head: "Noto Naskh Arabic", "Vazirmatn", serif; --font-brand: "Noto Naskh Arabic", serif; }
:root:lang(zh) { --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-head: "Noto Serif SC", "Songti SC", serif; --font-brand: "Noto Serif SC", serif; }
:root:lang(hi) { --font-body: "Noto Sans Devanagari", "Noto Sans", sans-serif; --font-head: "Noto Serif Devanagari", "Noto Serif", serif; --font-brand: "Noto Serif Devanagari", serif; }
:root:lang(ru) { --font-brand: "Noto Serif", Georgia, serif; }
:root:lang(ur) { --font-body: "Noto Naskh Arabic", "Vazirmatn", serif; --font-head: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; --font-brand: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; }
:root:lang(ja) { --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; --font-head: "Noto Serif JP", "Hiragino Mincho ProN", serif; --font-brand: "Noto Serif JP", serif; }
:root:lang(ko) { --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --font-head: "Noto Serif KR", serif; --font-brand: "Noto Serif KR", serif; }
:root:lang(ur) body { line-height: 2; }
:root:lang(ur) h1, :root:lang(ur) h2, :root:lang(ur) h3 { line-height: 2.1; }
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.8; margin: 0; }
:root:lang(fa) body, :root:lang(ar) body { line-height: 1.9; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.glyph { font-family: var(--font-glyph); font-variant-emoji: text; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.45; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.masthead { border-bottom: 1px solid var(--line); background: var(--surface); }
.masthead .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px 8px; }
.mark { width: 60px; height: 60px; flex: none; }
.brand { flex: 1 1 0; min-width: 0; }
.brand h1 { font-family: var(--font-brand); font-weight: 600; font-size: 2rem; line-height: 1.6; color: var(--lapis); letter-spacing: .02em; }
:root:lang(fa) .brand h1 { line-height: 1.95; letter-spacing: 0; }
.brand p { margin: 0; color: var(--muted); font-size: .9rem; }
.langsel { flex: none; display: grid; gap: 2px; }
.langsel label { font-size: .75rem; color: var(--muted); }
.langsel select { min-height: 36px; padding: 4px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; }
@media (max-width: 640px) {
  .masthead .wrap { flex-wrap: wrap; }
  .mark { width: 44px; height: 44px; }
  .brand h1 { font-size: 1.6rem; }
  .brand p { font-size: .8rem; }
  .langsel { width: 100%; grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
}
.navbar { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 10px 14px 12px; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; font-weight: 500; }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--brass); }
.nav a:hover { color: var(--ink); }

main { padding-block: 24px 56px; }
.grid { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
.panel h2 { font-size: 1.15rem; color: var(--lapis); }
.field { display: grid; gap: 4px; }
.field > label, .field > .lbl { font-size: .85rem; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }
input[type=text], input[type=number], input[type=time], select, textarea {
  width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; min-height: 40px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.7; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--lapis); color: var(--surface); }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; color: var(--muted); }
.btn { background: var(--lapis); color: var(--surface); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: progress; }
details.more summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
details.more[open] summary { margin-bottom: 10px; }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }

.result { display: grid; gap: 26px; min-width: 0; }
.headline { display: grid; gap: 6px; }
.headline h2 { font-size: 1.5rem; }
.headline .meta { color: var(--muted); font-size: .9rem; }
.badge { display: inline-block; font-size: .75rem; padding: 1px 9px; border-radius: 99px; background: var(--brass-soft); color: var(--brass); font-weight: 700; vertical-align: middle; margin-inline-start: 8px; font-family: var(--font-body); }
.chartrow { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 1020px) { .chartrow { grid-template-columns: minmax(0, 1fr); } }
.wheel { width: 100%; max-width: 580px; aspect-ratio: 1; display: block; margin-inline: auto; }
.wheel text { font-family: var(--font-glyph); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .88rem; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
.pos { color: var(--good); } .neg { color: var(--hard); }

.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump a { font-size: .82rem; padding: 2px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--ink); text-decoration: none; background: var(--surface); }
.jump a.deep { border-color: var(--brass); color: var(--brass); }
.sec { display: grid; gap: 4px; scroll-margin-top: 110px; }
.sec > h3 { font-size: 1.2rem; color: var(--lapis); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.sec.deep > h3 { color: var(--brass); border-bottom-color: var(--brass); }
.secnote { color: var(--muted); font-size: .88rem; margin: 0 0 4px; max-width: 75ch; }
.item { padding: 10px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 2px; }
.item:last-child { border-bottom: 0; }
.item h4 { font-family: var(--font-body); font-size: .98rem; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item p { margin: 0; max-width: 75ch; }
.tone { font-family: var(--font-body); font-size: .72rem; font-weight: 700; padding: 0 8px; border-radius: 99px; line-height: 1.9; }
.tone.good { background: var(--good-bg); color: var(--good); }
.tone.hard { background: var(--hard-bg); color: var(--hard); }
.tone.mixed { background: var(--mixed-bg); color: var(--mixed); }
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 420px; margin-block: 6px; }
.pillars div { border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 6px 4px; background: var(--surface); }
.pillars b { display: block; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 1.6rem; line-height: 1.25; }
.pillars small { color: var(--muted); font-size: .75rem; }

.verdict { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; background: var(--surface); display: grid; gap: 8px; }
.verdict .ans { font-family: var(--font-head); font-size: 1.45rem; font-weight: 700; }
.verdict.good .ans { color: var(--good); } .verdict.hard .ans { color: var(--hard); } .verdict.mixed .ans { color: var(--mixed); }
.scale { height: 8px; border-radius: 99px; background: linear-gradient(to right, var(--hard), var(--mixed-bg) 50%, var(--good)); position: relative; }
[dir="rtl"] .scale { background: linear-gradient(to left, var(--hard), var(--mixed-bg) 50%, var(--good)); }
.scale i { position: absolute; top: -5px; width: 4px; height: 18px; background: var(--ink); border-radius: 2px; margin-inline-start: -2px; }
.scale-l { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }

.oracle { border: 1px solid var(--brass); border-radius: 12px; background: var(--surface); padding: 18px 20px; display: grid; gap: 12px; }
.oracle h3 { color: var(--brass); font-size: 1.15rem; }
.oracle .ans p { margin: 0 0 .7em; max-width: 75ch; }
.oracle .ans ul { margin: 0 0 .7em; padding-inline-start: 1.2em; }
.oracle .q { color: var(--muted); font-size: .9rem; border-top: 1px dashed var(--line); padding-top: 10px; margin: 0; }
.oracle .ask { display: flex; gap: 8px; flex-wrap: wrap; }
.oracle .ask input { flex: 1 1 220px; }
.status { color: var(--muted); font-size: .88rem; margin: 0; }

.slots { display: grid; gap: 12px; }
.slot { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; }
.slot .when { font-weight: 700; font-size: 1.05rem; }
.slot .win { color: var(--muted); font-size: .85rem; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--turq); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: .78rem; padding: 0 8px; border-radius: 99px; border: 1px solid var(--line); line-height: 1.9; background: transparent; }
button.chip { cursor: pointer; }
.chip.p { color: var(--good); border-color: var(--good); } .chip.n { color: var(--hard); border-color: var(--hard); }

.lib { display: grid; gap: 28px; max-width: 900px; }
.lib dl { margin: 0; display: grid; }
.lib dt { font-weight: 700; padding-top: 12px; }
.lib dd { margin: 0; color: var(--muted); padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.lib .era { color: var(--brass); font-size: .85rem; font-weight: 500; margin-inline-start: 6px; }
.lib h4.trad { font-family: var(--font-head); color: var(--lapis); font-size: 1.05rem; margin-top: 18px; }
.note { border-inline-start: 3px solid var(--brass); padding: 4px 14px; color: var(--muted); margin: 0; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brass); border-radius: 50%; animation: sp 0.9s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.who { font-size: .9rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
.who .lbl { color: var(--muted); }
.who a { color: var(--lapis); }
h3.sub { font-family: var(--font-head); font-size: 1rem; color: var(--brass); border-top: 1px solid var(--line); padding-top: 12px; }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.meter { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; display: grid; gap: 4px; }
.meter span { font-size: .82rem; color: var(--muted); }
.meter b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.meter.f .bar b { background: var(--hard); }
.big { font-family: var(--font-head); font-size: 2.4rem; font-weight: 700; color: var(--brass); line-height: 1.2; }
.chatwrap { max-width: 860px; margin-inline: auto; display: grid; gap: 14px; }
.chathead h2 { font-size: 1.4rem; color: var(--lapis); }
.chatopts { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 6px; }
.chatopts select { min-height: 34px; padding: 2px 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 7px; max-width: 200px; }
.chatlog { display: grid; gap: 12px; min-height: 240px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; }
.msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 0 0 .6em; padding-inline-start: 1.2em; }
.msg.user { justify-self: end; background: var(--lapis); color: var(--surface); border-end-end-radius: 4px; }
.msg.bot { justify-self: start; background: var(--paper); border: 1px solid var(--line); border-end-start-radius: 4px; }
.msg.bot .from { font-size: .75rem; color: var(--brass); font-weight: 700; display: block; margin-bottom: 4px; }
.chatform { display: flex; gap: 8px; align-items: end; }
.chatform textarea { flex: 1 1 auto; min-height: 52px; }
.linkbtn { background: none; border: 0; color: var(--lapis); cursor: pointer; padding: 0; text-decoration: underline; font-size: inherit; }
footer { color: var(--muted); font-size: .82rem; border-top: 1px solid var(--line); padding-block: 18px 30px; }
</style>

<header class="masthead">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="29" style="fill:none;stroke:var(--brass);stroke-width:2.5"/>
      <circle cx="32" cy="32" r="22" style="fill:none;stroke:var(--brass);stroke-width:1"/>
      <g style="stroke:var(--brass);stroke-width:1">
        <line x1="32" y1="3" x2="32" y2="10"/><line x1="32" y1="54" x2="32" y2="61"/><line x1="3" y1="32" x2="10" y2="32"/><line x1="54" y1="32" x2="61" y2="32"/>
        <line x1="11.5" y1="11.5" x2="16" y2="16"/><line x1="48" y1="48" x2="52.5" y2="52.5"/><line x1="52.5" y1="11.5" x2="48" y2="16"/><line x1="16" y1="48" x2="11.5" y2="52.5"/>
      </g>

<main class="wrap">
  <section class="view" id="view-natal" aria-labelledby="t-natal">
    <div class="grid">
      <form class="panel" id="natal-form" autocomplete="off">
        <h2 id="t-natal" data-i18n="ui.natal.title"></h2>
        <div class="field"><label for="n-name" data-i18n="ui.natal.name"></label><input type="text" id="n-name" data-i18n-ph="ui.natal.namePh"></div>
        <div class="field"><span class="lbl" data-i18n="ui.natal.kind"></span>
          <div class="seg" role="group" id="n-kind">
            <button type="button" data-v="person" aria-pressed="true" data-i18n="ui.natal.person"></button>
            <button type="button" data-v="business" aria-pressed="false" data-i18n="ui.natal.business"></button>
          </div>
        </div>
        <div class="field"><span class="lbl" data-i18n="ui.natal.calendar"></span>
          <div class="seg" role="group" id="n-cal">
            <button type="button" data-v="g" aria-pressed="true" data-i18n="ui.natal.greg"></button>
            <button type="button" data-v="j" aria-pressed="false" data-i18n="ui.natal.jalali"></button>
          </div>
        </div>
        <div class="field"><span class="lbl" data-i18n="ui.natal.date"></span>
          <div class="row">
            <input type="number" id="n-day" min="1" max="31" data-i18n-aria="ui.natal.day" value="21">
            <select id="n-month" data-i18n-aria="ui.natal.month"></select>
            <input type="number" id="n-year" data-i18n-aria="ui.natal.year" value="1991">
          </div>
        </div>
        <div class="field"><label for="n-time" data-i18n="ui.natal.time"></label>
          <input type="time" id="n-time" value="08:30">
          <label class="check"><input type="checkbox" id="n-notime"> <span data-i18n="ui.natal.notime"></span></label>
        </div>
        <div class="field"><label for="n-city" data-i18n="ui.city"></label><select id="n-city" class="city"></select></div>
        <div class="manual" id="n-manual" hidden>
          <div class="row">
            <div class="field"><label for="n-lat" data-i18n="ui.lat"></label><input type="number" step="0.0001" id="n-lat" value="35.6892"></div>
