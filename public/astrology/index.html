<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Nastaliq+Urdu:wght@600&family=Noto+Sans:wght@400;500;700&family=Noto+Serif:wght@500;700&family=Cinzel:wght@600&family=Noto+Sans+Symbols&family=Noto+Sans+Symbols+2&display=swap">
<style>
:root {
  --paper: #edf0f6;
  --surface: #f8f9fc;
  --sunk: #e2e6f0;
  --ink: #18203f;
  --muted: #586083;
  --line: #c9cfde;
  --lapis: #25367c;
  --lapis-soft: #d9def2;
  --brass: #946c22;
  --brass-soft: #efe3c8;
  --turq: #0f7772;
  --good: #1c7449;
  --good-bg: #dcefe3;
  --hard: #a3352c;
  --hard-bg: #f6dfdc;
  --mixed: #7d5f12;
  --mixed-bg: #f2e8cf;
  --font-body: "Noto Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "Noto Serif", Georgia, serif;
  --font-brand: "Cinzel", "Noto Serif", Georgia, serif;
  --font-glyph: "Noto Sans Symbols", "Noto Sans Symbols 2", "Segoe UI Symbol", "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1124; --surface: #131b35; --sunk: #0f1630; --ink: #ebe6d6; --muted: #9ba2bf; --line: #2a3458;
    --lapis: #93a7f2; --lapis-soft: #1d2a55; --brass: #d8ad58; --brass-soft: #2e2716; --turq: #49c4b9;
    --good: #67c995; --good-bg: #133326; --hard: #ee8276; --hard-bg: #3a1a19; --mixed: #dcb460; --mixed-bg: #33290f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1124; --surface: #131b35; --sunk: #0f1630; --ink: #ebe6d6; --muted: #9ba2bf; --line: #2a3458;
  --lapis: #93a7f2; --lapis-soft: #1d2a55; --brass: #d8ad58; --brass-soft: #2e2716; --turq: #49c4b9;
  --good: #67c995; --good-bg: #133326; --hard: #ee8276; --hard-bg: #3a1a19; --mixed: #dcb460; --mixed-bg: #33290f;
  color-scheme: dark;
}
:root:lang(fa) { --font-body: "Vazirmatn", Tahoma, sans-serif; --font-head: "Noto Naskh Arabic", "Vazirmatn", serif; --font-brand: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; }
:root:lang(ar) { --font-body: "Vazirmatn", Tahoma, sans-serif; --font-head: "Noto Naskh Arabic", "Vazirmatn", serif; --font-brand: "Noto Naskh Arabic", serif; }
:root:lang(zh) { --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --font-head: "Noto Serif SC", "Songti SC", serif; --font-brand: "Noto Serif SC", serif; }
:root:lang(hi) { --font-body: "Noto Sans Devanagari", "Noto Sans", sans-serif; --font-head: "Noto Serif Devanagari", "Noto Serif", serif; --font-brand: "Noto Serif Devanagari", serif; }
:root:lang(ru) { --font-brand: "Noto Serif", Georgia, serif; }
:root:lang(ur) { --font-body: "Noto Naskh Arabic", "Vazirmatn", serif; --font-head: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; --font-brand: "Noto Nastaliq Urdu", "Noto Naskh Arabic", serif; }
:root:lang(ja) { --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; --font-head: "Noto Serif JP", "Hiragino Mincho ProN", serif; --font-brand: "Noto Serif JP", serif; }
:root:lang(ko) { --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; --font-head: "Noto Serif KR", serif; --font-brand: "Noto Serif KR", serif; }
:root:lang(ur) body { line-height: 2; }
:root:lang(ur) h1, :root:lang(ur) h2, :root:lang(ur) h3 { line-height: 2.1; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* Layout: a single narrow column like a phone app, a small top bar, big friendly cards, and a tab bar fixed at the bottom. */
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.8; margin: 0; }
:root:lang(fa) body, :root:lang(ar) body { line-height: 1.95; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.glyph { font-family: var(--font-glyph); font-variant-emoji: text; }
h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.45; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
a { color: var(--lapis); }

.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 6; padding-top: env(safe-area-inset-top, 0px); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--lapis); min-width: 0; flex: 1 1 auto; }
.logo svg { width: 34px; height: 34px; flex: none; }
.logo b { font-family: var(--font-brand); font-weight: 600; font-size: 1.2rem; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
:root:lang(fa) .logo b, :root:lang(ur) .logo b { line-height: 2; font-size: 1.45rem; }
.top select { flex: none; width: auto; min-height: 38px; padding: 4px 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 99px; max-width: 9.5em; }

main { padding-block: 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 18px; }

.hero { display: grid; gap: 4px; padding-block: 6px 2px; }
.hero h1 { font-size: 1.65rem; color: var(--ink); }
.hero p { margin: 0; color: var(--muted); font-size: 1rem; }
.hero .sign { color: var(--brass); font-weight: 700; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
.card h2 { font-family: var(--font-body); font-size: 1.15rem; font-weight: 700; color: var(--lapis); margin-bottom: 4px; }
.card > p { margin: 0; }
.card .sub { color: var(--muted); margin: 0 0 6px; font-size: .95rem; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; text-decoration: none; color: var(--ink); display: grid; gap: 2px; align-content: start; min-height: 132px; transition: border-color .15s, transform .15s; }
.tile:hover { border-color: var(--brass); }
.tile:active { transform: scale(.98); }
.tile .ic { font-size: 1.9rem; line-height: 1.3; }
.tile b { font-size: 1.08rem; }
.tile span { font-size: .86rem; color: var(--muted); line-height: 1.6; }
.tile.wide { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto 1fr; column-gap: 14px; align-items: center; }
.tile.wide .ic { grid-row: span 2; }
@media (max-width: 360px) { .tiles { grid-template-columns: minmax(0, 1fr); } }

.who { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 6px 8px 6px 14px; font-size: .92rem; }
[dir="rtl"] .who { padding: 6px 14px 6px 8px; }
.who span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.who a { flex: none; font-weight: 700; text-decoration: none; padding: 4px 12px; border-radius: 99px; background: var(--lapis-soft); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { background: var(--brass-soft); color: var(--brass); font-weight: 700; border-radius: 99px; padding: 5px 14px; font-size: .95rem; }
.tagtitle { font-size: .85rem; color: var(--muted); margin: 0 0 6px; }

.pcard { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.pcard .ic { font-size: 1.5rem; line-height: 1.5; grid-row: span 2; }
.pcard h3 { font-family: var(--font-body); font-size: 1.05rem; font-weight: 700; color: var(--lapis); }
.pcard p { margin: 0; font-size: 1.04rem; }
:root:lang(fa) .pcard p, :root:lang(ar) .pcard p, :root:lang(ur) .pcard p { line-height: 2.1; }
.stack { display: grid; gap: 12px; }

form.f { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-weight: 700; font-size: .95rem; }
.field .help { font-size: .82rem; color: var(--muted); margin: 0; }
input[type=text], input[type=number], input[type=time], select, textarea {
  width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 48px; font-size: 16px;
}
textarea { resize: vertical; line-height: 1.7; }
.date3 { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--lapis); cursor: pointer; padding: 0; text-decoration: underline; font-size: .85rem; justify-self: start; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.picks button { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 8px 14px; cursor: pointer; min-height: 42px; }
.picks button[aria-pressed="true"] { background: var(--lapis); border-color: var(--lapis); color: var(--surface); font-weight: 700; }
.btn { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--lapis); color: var(--surface); border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 1.05rem; cursor: pointer; min-height: 52px; }
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.soft { background: var(--brass-soft); color: var(--brass); }
.btn.ghost { background: transparent; color: var(--lapis); border: 1px solid var(--line); }

.match { text-align: center; display: grid; gap: 6px; justify-items: center; }
.match .names { color: var(--muted); font-size: .95rem; }
.match .pct { font-family: var(--font-head); font-size: 3rem; font-weight: 700; line-height: 1.2; color: var(--brass); }
.match p { margin: 0; max-width: 46ch; }
.meters { display: grid; gap: 10px; margin-top: 12px; }
.meter { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); align-items: center; gap: 10px; font-size: .92rem; }
.meter .bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter .bar b { display: block; height: 100%; background: var(--turq); border-radius: 99px; }
.meter.f .bar b { background: var(--hard); }

.days { display: grid; gap: 0; }
.day { display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: 2px 10px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.day:last-child { border-bottom: 0; }
.day .ic { font-size: 1.3rem; grid-row: span 2; }
.day b { font-size: .95rem; }
.day span { color: var(--ink); font-size: .98rem; }

.slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 14px 0; border-bottom: 1px dashed var(--line); align-items: center; }
.slot:last-child { border-bottom: 0; }
.slot b { font-size: 1.02rem; }
.slot .t { color: var(--muted); font-size: .92rem; grid-column: 1; }
.slot .stars { grid-row: 1 / span 2; grid-column: 2; color: var(--brass); font-size: 1.1rem; letter-spacing: 2px; }
.slot .top1 { display: inline-block; font-size: .72rem; background: var(--brass-soft); color: var(--brass); border-radius: 99px; padding: 0 8px; margin-inline-start: 6px; vertical-align: middle; }
.nowbox { display: flex; gap: 12px; align-items: center; }
.nowbox .ic { font-size: 1.8rem; }
.nowbox p { margin: 0; font-weight: 700; font-size: 1.08rem; }
.nowbox.good p { color: var(--good); } .nowbox.hard p { color: var(--hard); } .nowbox.mixed p { color: var(--mixed); }

.letter { border: 1px solid var(--brass); border-radius: 18px; background: var(--surface); padding: 18px 20px; display: grid; gap: 10px; }
.letter h2 { color: var(--brass); font-family: var(--font-head); font-size: 1.15rem; }
.letter .ans p { margin: 0 0 .8em; font-size: 1.04rem; }
.letter .ans p:last-child { margin-bottom: 0; }
:root:lang(fa) .letter .ans p, :root:lang(ar) .letter .ans p, :root:lang(ur) .letter .ans p { line-height: 2.1; }
.letter .q { color: var(--muted); font-size: .9rem; border-top: 1px dashed var(--line); padding-top: 10px; margin: 0; }
.letter form { display: flex; gap: 8px; }
.letter form input { flex: 1 1 auto; min-width: 0; }
.letter form .btn { width: auto; min-height: 48px; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .9rem; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-align: start; line-height: 1.6; }
.status { color: var(--muted); font-size: .9rem; margin: 0; }
.note { border-inline-start: 3px solid var(--brass); padding: 4px 14px; color: var(--muted); margin: 0; font-size: .92rem; }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--brass); border-radius: 50%; animation: sp 0.9s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .tile { transition: none; } }

/* chat */
.chatlog { display: grid; gap: 12px; align-content: start; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 16px; }
.msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
.msg ul { margin: 0 0 .6em; padding-inline-start: 1.2em; }
.msg.user { justify-self: end; background: var(--lapis); color: var(--surface); border-end-end-radius: 4px; }
.msg.bot { justify-self: start; background: var(--surface); border: 1px solid var(--line); border-end-start-radius: 4px; }
.msg.bot .from { font-size: .78rem; color: var(--brass); font-weight: 700; display: block; margin-bottom: 2px; }
.chatform { display: flex; gap: 8px; align-items: end; position: sticky; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); background: var(--paper); padding-block: 8px; }
.chatform textarea { flex: 1 1 auto; min-height: 52px; max-height: 160px; }
.chatform .btn { width: auto; flex: none; }

/* bottom tab bar */
.tabbar { position: fixed; inset: auto 0 0 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar .wrap { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tabbar a { display: grid; justify-items: center; gap: 0; padding: 8px 0 8px; font-size: .74rem; color: var(--muted); text-decoration: none; line-height: 1.5; }
.tabbar a .ic { font-size: 1.35rem; line-height: 1.3; filter: grayscale(1); opacity: .7; }
.tabbar a[aria-current="page"] { color: var(--lapis); font-weight: 700; }
.tabbar a[aria-current="page"] .ic { filter: none; opacity: 1; }

.foot { color: var(--muted); font-size: .8rem; text-align: center; margin: 8px 0 0; }

/* technical details, folded away */
details.tech { border: 1px dashed var(--line); border-radius: 14px; padding: 10px 14px; }
details.tech > summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
details.tech[open] { display: grid; gap: 20px; }
.wheel { width: 100%; max-width: 440px; aspect-ratio: 1; display: block; margin-inline: auto; }
.wheel text { font-family: var(--font-glyph); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .85rem; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 9px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
.pos { color: var(--good); } .neg { color: var(--hard); }
.sec { display: grid; gap: 4px; }
.sec > h3 { font-size: 1.05rem; color: var(--lapis); padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.sec.deep > h3 { color: var(--brass); border-bottom-color: var(--brass); }
.secnote { color: var(--muted); font-size: .85rem; margin: 0 0 4px; }
.item { padding: 8px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 2px; font-size: .92rem; }
.item:last-child { border-bottom: 0; }
.item h4 { font-family: var(--font-body); font-size: .95rem; font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item p { margin: 0; }
.tone { font-size: .7rem; font-weight: 700; padding: 0 8px; border-radius: 99px; line-height: 1.9; }
.tone.good { background: var(--good-bg); color: var(--good); }
.tone.hard { background: var(--hard-bg); color: var(--hard); }
.tone.mixed { background: var(--mixed-bg); color: var(--mixed); }
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; max-width: 420px; margin-block: 6px; }
.pillars div { border: 1px solid var(--line); border-radius: 8px; text-align: center; padding: 6px 4px; background: var(--surface); }
.pillars b { display: block; font-family: "Noto Serif SC", "Songti SC", serif; font-size: 1.5rem; line-height: 1.25; }
.pillars small { color: var(--muted); font-size: .72rem; }
.lib dl { margin: 0; display: grid; }
.lib dt { font-weight: 700; padding-top: 10px; }
.lib dd { margin: 0; color: var(--muted); padding-bottom: 10px; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.lib .era { color: var(--brass); font-size: .82rem; font-weight: 500; margin-inline-start: 6px; }
.lib h4.trad { font-family: var(--font-head); color: var(--lapis); font-size: 1.02rem; margin-top: 16px; }
.dash-kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.dash-kpis div { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; }
.dash-kpis span { display: block; color: var(--muted); font-size: .8rem; }
.dash-kpis b { font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.vrow { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; }
.vrow summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.vrow summary span { color: var(--muted); font-size: .82rem; }
.ev { border-top: 1px dashed var(--line); padding: 8px 0; font-size: .88rem; }
.ev small { color: var(--muted); }
.ev p { margin: 2px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#home">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" style="fill:none;stroke:var(--brass);stroke-width:3"/>
        <g style="stroke:var(--brass);stroke-width:1.5">
          <line x1="32" y1="3" x2="32" y2="11"/><line x1="32" y1="53" x2="32" y2="61"/><line x1="3" y1="32" x2="11" y2="32"/><line x1="53" y1="32" x2="61" y2="32"/>
        </g>
        <path d="M32 13 L37 32 L32 51 L27 32 Z" style="fill:var(--lapis)"/>
        <circle cx="32" cy="32" r="3.5" style="fill:var(--brass)"/>
      </svg>
      <b data-i18n="ui.brand">Akhtarnameh</b>

  </div>
</header>

<main class="wrap" id="main">
  <section class="view" id="view-home" aria-live="polite"></section>
  <section class="view" id="view-profile" hidden></section>
  <section class="view" id="view-me" hidden></section>
  <section class="view" id="view-love" hidden></section>
  <section class="view" id="view-money" hidden></section>
  <section class="view" id="view-ask" hidden></section>
  <section class="view" id="view-when" hidden></section>
  <section class="view" id="view-more" hidden></section>
  <section class="view" id="view-biz" hidden></section>
  <section class="view" id="view-world" hidden></section>

</main>

<nav class="tabbar" aria-label="Sections">
  <div class="wrap">
    <a href="#home" data-tab="home"><span class="ic" aria-hidden="true">🏠</span><span data-i18n="s.nav.home"></span></a>
